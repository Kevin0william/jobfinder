{% load static %}
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat avec JobFinder</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1877f2 0%, #0d66d0 100%);
            height: 100dvh;
            overflow: hidden;
            position: fixed;
            width: 100%;
            top: 0;
            left: 0;
        }

        .chat-wrapper {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            background: white;
        }

        .chat-header {
            background: linear-gradient(135deg, #1877f2 0%, #0d66d0 100%);
            color: white;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
            z-index: 100;
            flex-shrink: 0;
        }

        .chat-header-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            color: #1877f2;
            margin-right: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            flex-shrink: 0;
        }

        .chat-header-info {
            flex: 1;
            min-width: 0;
        }

        .chat-header-info h1 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 2px;
            line-height: 1.2;
        }

        .chat-header-info p {
            font-size: 12px;
            opacity: 0.9;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 14px 12px;
            background: #ffffff;
            scroll-behavior: smooth;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .messages-container::-webkit-scrollbar {
            width: 6px;
        }

        .messages-container::-webkit-scrollbar-track {
            background: #f0f2f5;
        }

        .messages-container::-webkit-scrollbar-thumb {
            background: #bcc0c4;
            border-radius: 3px;
        }

        .messages-container::-webkit-scrollbar-thumb:hover {
            background: #8a8d91;
        }

        .message {
            display: flex;
            margin-bottom: 0;
            animation: fadeIn 0.3s ease-in;
            align-items: flex-end;
            gap: 8px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.user .message-avatar {
            order: 2;
            margin-left: 8px;
            margin-right: 0;
        }

        .message.user .message-content {
            order: 1;
        }

        .message.assistant {
            justify-content: flex-start;
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 13px;
            flex-shrink: 0;
            margin-right: 8px;
        }

        .message.user .message-avatar {
            background: linear-gradient(135deg, #1877f2 0%, #0d66d0 100%);
            color: white;
        }

        .message.assistant .message-avatar {
            background: linear-gradient(135deg, #31a24c 0%, #1ecb7f 100%);
            color: white;
        }

        .message-content {
            max-width: 72%;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .message-bubble {
            padding: 9px 13px;
            border-radius: 16px;
            line-height: 1.4;
            word-wrap: break-word;
            word-break: break-word;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
            font-size: 14px;
        }

        .message.user .message-bubble {
            background: #1877f2;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.assistant .message-bubble {
            background: #f0f2f5;
            color: #050505;
            border-bottom-left-radius: 4px;
        }

        .message-time {
            font-size: 11px;
            opacity: 0.6;
            padding: 0 6px;
        }

        .message.user .message-time {
            text-align: right;
            color: #65676b;
        }

        .message.assistant .message-time {
            text-align: left;
            color: #65676b;
        }

        .chat-input-container {
            padding: 10px 12px;
            background: white;
            border-top: 1px solid #e5e5ea;
            box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.05);
            flex-shrink: 0;
            z-index: 100;
        }

        .chat-form {
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
            min-width: 0;
        }

        .chat-input {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid #e5e5ea;
            border-radius: 20px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.2s ease;
            background: #f0f2f5;
            resize: none;
            max-height: 100px;
        }

        .chat-input:focus {
            outline: none;
            border-color: #1877f2;
            background: white;
            box-shadow: 0 0 0 2px rgba(24, 119, 242, 0.1);
        }

        .chat-input::placeholder {
            color: #65676b;
        }

        .send-button {
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 50%;
            background: #1877f2;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(24, 119, 242, 0.3);
        }

        .send-button:hover:not(:disabled) {
            background: #0d66d0;
            box-shadow: 0 4px 12px rgba(24, 119, 242, 0.4);
        }

        .send-button:active:not(:disabled) {
            transform: scale(0.95);
        }

        .send-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .send-icon {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .typing-indicator {
            display: none;
            padding: 9px 13px;
            background: #f0f2f5;
            border-radius: 16px;
            border-bottom-left-radius: 4px;
            width: fit-content;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        }

        .typing-indicator.active {
            display: block;
        }

        .typing-dots {
            display: flex;
            gap: 4px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #bcc0c4;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%,
            60%,
            100% {
                transform: translateY(0);
                opacity: 0.5;
            }
            30% {
                transform: translateY(-8px);
                opacity: 1;
            }
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #65676b;
            text-align: center;
            padding: 20px;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.6;
        }

        .empty-state h3 {
            font-size: 16px;
            margin-bottom: 8px;
            color: #050505;
            font-weight: 600;
        }

        .empty-state p {
            font-size: 13px;
            color: #65676b;
        }

        @media (max-width: 768px) {
            .chat-header-avatar {
                width: 40px;
                height: 40px;
                font-size: 18px;
            }

            .chat-header-info h1 {
                font-size: 15px;
            }

            .message-avatar {
                width: 30px;
                height: 30px;
                font-size: 12px;
            }

            .message-content {
                max-width: 75%;
            }

            .message-bubble {
                padding: 8px 12px;
                font-size: 13px;
            }
        }

        @media (max-width: 480px) {
            body {
                height: 100dvh;
            }

            .chat-header {
                padding: 12px 12px;
            }

            .chat-header-avatar {
                width: 36px;
                height: 36px;
                font-size: 16px;
                margin-right: 10px;
            }

            .chat-header-info h1 {
                font-size: 14px;
            }

            .chat-header-info p {
                font-size: 11px;
            }

            .messages-container {
                padding: 10px 10px;
                gap: 8px;
            }

            .message-content {
                max-width: 80%;
            }

            .message-bubble {
                padding: 8px 11px;
                font-size: 13px;
                border-radius: 14px;
            }

            .message-avatar {
                width: 28px;
                height: 28px;
                font-size: 11px;
            }

            .message.user .message-avatar {
                margin-left: 6px;
            }

            .message.assistant .message-avatar {
                margin-right: 6px;
            }

            .chat-input-container {
                padding: 8px 10px;
            }

            .chat-form {
                gap: 6px;
            }

            .input-wrapper {
                min-width: 0;
            }

            .chat-input {
                padding: 9px 12px;
                font-size: 13px;
                border-radius: 18px;
            }

            .send-button {
                width: 34px;
                height: 34px;
            }

            .send-icon {
                width: 15px;
                height: 15px;
            }

            .message-time {
                font-size: 10px;
            }

            .typing-indicator {
                padding: 8px 11px;
                border-radius: 14px;
            }

            .empty-state-icon {
                font-size: 40px;
                margin-bottom: 12px;
            }

            .empty-state h3 {
                font-size: 14px;
            }

            .empty-state p {
                font-size: 12px;
            }
        }

        @supports (padding: max(0px)) {
            body {
                height: 100dvh;
            }

            .chat-input-container {
                padding-bottom: max(8px, env(safe-area-inset-bottom));
            }
        }
    </style>
</head>

<body>
    <div class="chat-wrapper">
        <div class="chat-header">
            <div class="chat-header-avatar">J</div>
            <div class="chat-header-info">
                <h1>JobFinder</h1>
                <p>Votre assistante intelligente</p>
            </div>
        </div>

        <div class="messages-container" id="chat-box">
            {% if chats %} {% for msg in chats %}
            <div class="message {% if msg.role == 'user' %}user{% else %}assistant{% endif %}">
                <div class="message-avatar">
                    {% if msg.role == 'user' %}M{% else %}J{% endif %}
                </div>
                <div class="message-content">
                    <div class="message-bubble">{{ msg.content }}</div>
                </div>
            </div>
            {% endfor %} {% else %}
            <div class="empty-state">
                <div class="empty-state-icon">💬</div>
                <h3>Commencez une conversation</h3>
                <p>Envoyez un message à Lia pour démarrer</p>
            </div>
            {% endif %}

            <div class="message assistant" id="typing-indicator-wrapper" style="display: none;">
                <div class="message-avatar">L</div>
                <div class="message-content">
                    <div class="typing-indicator active">
                        <div class="typing-dots">
                            <div class="typing-dot"></div>
                            <div class="typing-dot"></div>
                            <div class="typing-dot"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="chat-input-container">
            <form class="chat-form" id="chat-form">
                <div class="input-wrapper">
                    <input type="text" class="chat-input" id="user-message" placeholder="Écrivez votre message..." autocomplete="off" required>
                </div>
                <button type="submit" class="send-button" id="send-button">
                    <svg class="send-icon" viewBox="0 0 24 24">
                        <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                    </svg>
                </button>
            </form>
        </div>
    </div>

    <script>
        const form = document.getElementById('chat-form');
        const chatBox = document.getElementById('chat-box');
        const userMessageInput = document.getElementById('user-message');
        const sendButton = document.getElementById('send-button');
        const typingIndicator = document.getElementById('typing-indicator-wrapper');

        function scrollToBottom() {
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function createMessageElement(role, content) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;

            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = role === 'user' ? 'M' : 'L';

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';

            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            bubble.textContent = content;

            contentDiv.appendChild(bubble);
            messageDiv.appendChild(avatar);
            messageDiv.appendChild(contentDiv);

            return messageDiv;
        }

        function showTypingIndicator() {
            typingIndicator.style.display = 'flex';
            scrollToBottom();
        }

        function hideTypingIndicator() {
            typingIndicator.style.display = 'none';
        }

        function disableInput() {
            userMessageInput.disabled = true;
            sendButton.disabled = true;
        }

        function enableInput() {
            userMessageInput.disabled = false;
            sendButton.disabled = false;
            userMessageInput.focus();
        }

        form.addEventListener('submit', async(e) => {
            e.preventDefault();

            const message = userMessageInput.value.trim();
            if (!message) return;

            const emptyState = chatBox.querySelector('.empty-state');
            if (emptyState) {
                emptyState.remove();
            }

            const userMessage = createMessageElement('user', message);
            chatBox.insertBefore(userMessage, typingIndicator);

            userMessageInput.value = '';
            disableInput();
            scrollToBottom();

            showTypingIndicator();

            try {
                const response = await fetch("{% url 'chat_lia' %}", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded",
                        "X-CSRFToken": "{{ csrf_token }}",
                    },
                    body: `message=${encodeURIComponent(message)}`
                });

                const data = await response.json();

                hideTypingIndicator();

                const assistantMessage = createMessageElement('assistant', data.response);
                chatBox.appendChild(assistantMessage);

                scrollToBottom();
            } catch (err) {
                hideTypingIndicator();

                const errorMessage = createMessageElement('assistant', 'Erreur de connexion. Veuillez réessayer.');
                chatBox.appendChild(errorMessage);

                scrollToBottom();
            } finally {
                enableInput();
            }
        });

        scrollToBottom();
    </script>
</body>

</html>
