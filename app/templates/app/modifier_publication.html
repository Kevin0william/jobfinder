<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifier votre publication - JobFinder</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f8fafc 0%, #e0f2fe 50%, #dbeafe 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 0;
        }
        
        header {
            background: #ffffff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #e5e7eb;
        }
        
        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            color: #1e40af;
            letter-spacing: -0.5px;
        }
        
        .logo span {
            color: #3b82f6;
        }
        
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.65rem 1.25rem;
            background: #f1f5f9;
            color: #475569;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
            font-size: 0.95rem;
        }
        
        .back-btn:hover {
            background: #e2e8f0;
            color: #1e293b;
            transform: translateX(-3px);
        }
        
        .back-btn i {
            font-size: 1.2rem;
        }
        
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }
        
        .create-container {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08), 0 0 0 1px rgba(0, 0, 0, 0.04);
            width: 100%;
            max-width: 680px;
            overflow: hidden;
        }
        
        .create-header {
            padding: 1.5rem 2rem;
            border-bottom: 1px solid #e5e7eb;
            text-align: center;
        }
        
        .create-header h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1e293b;
            margin: 0;
        }
        
        form {
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        
        .textarea-wrapper {
            position: relative;
        }
        
        textarea {
            width: 100%;
            min-height: 220px;
            border: none;
            border-radius: 12px;
            resize: vertical;
            padding: 2rem;
            font-weight: 600;
            font-size: 1.5rem;
            color: #ffffff;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
            line-height: 1.6;
        }
        
        textarea::placeholder {
            color: rgba(255, 255, 255, 0.7);
            font-weight: 500;
        }
        
        textarea:focus {
            outline: none;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(59, 130, 246, 0.4);
        }
        
        .style-section {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        
        .style-label {
            font-size: 0.95rem;
            font-weight: 600;
            color: #475569;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .style-label i {
            color: #3b82f6;
            font-size: 1.2rem;
        }
        
        .list_style {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(60px, 1fr));
            gap: 0.75rem;
            padding: 1rem;
            background: #f8fafc;
            border-radius: 12px;
        }
        
        .style-option {
            position: relative;
            cursor: pointer;
        }
        
        .style-option input[type="radio"] {
            display: none;
        }
        
        .style {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 3px solid transparent;
            position: relative;
            overflow: hidden;
        }
        
        .style::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.4s ease;
        }
        
        .style:hover::before {
            width: 100%;
            height: 100%;
        }
        
        .style:hover {
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
        }
        
        .style-option input[type="radio"]:checked+.style {
            border-color: #1e293b;
            box-shadow: 0 0 0 2px #ffffff, 0 0 0 4px #3b82f6;
            transform: scale(1.1);
        }
        
        .style-option input[type="radio"]:checked+.style::after {
            content: '\2713';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffffff;
            font-size: 1.5rem;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
            z-index: 1;
        }
        
        .s1 {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
        }
        
        .s2 {
            background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%);
        }
        
        .s3 {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }
        
        .s4 {
            background: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);
        }
        
        .s5 {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
        }
        
        .s6 {
            background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
        }
        
        .s7 {
            background: linear-gradient(135deg, #14b8a6 0%, #0d9488 100%);
        }
        
        .s8 {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
        }
        
        .s9 {
            background: linear-gradient(135deg, #ec4899 0%, #db2777 100%);
        }
        
        .s10 {
            background: linear-gradient(135deg, #eab308 0%, #ca8a04 100%);
        }
        
        .submit-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            border-radius: 10px;
            border: none;
            color: #ffffff;
            cursor: pointer;
            font-weight: 700;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        
        .submit-btn:hover {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.4);
        }
        
        .submit-btn:active {
            transform: translateY(0);
        }
        
        .submit-btn i {
            font-size: 1.3rem;
        }
        
        @media (max-width: 768px) {
            header {
                padding: 1rem;
            }
            .header-content {
                flex-direction: column;
                gap: 1rem;
                align-items: stretch;
            }
            .back-btn {
                justify-content: center;
            }
            main {
                padding: 1rem;
            }
            form {
                padding: 1.5rem;
            }
            textarea {
                min-height: 180px;
                font-size: 1.2rem;
                padding: 1.5rem;
            }
            .list_style {
                grid-template-columns: repeat(5, 1fr);
                gap: 0.5rem;
            }
            .create-header h2 {
                font-size: 1.25rem;
            }
        }
        
        @media (max-width: 480px) {
            .list_style {
                grid-template-columns: repeat(5, 1fr);
            }
            textarea {
                font-size: 1.1rem;
            }
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .create-container {
            animation: fadeIn 0.5s ease;
        }
    </style>
</head>

<body>
    <header>
        <div class="header-content">
            <h1 class="logo">Job<span>Finder</span></h1>
            <a href="{% url 'publication' %}" class="back-btn">
                <i class="ri-arrow-left-line"></i> Retour aux publications
            </a>
        </div>
    </header>

    <main>
        <div class="create-container">
            <div class="create-header">
                <h2>Modifier votre publication</h2>
            </div>

            <form action="" method="post">
                {% csrf_token %}

                <div class="textarea-wrapper">
                    <textarea name="message" id="message" placeholder="Quoi de neuf ?" required>{{publication.message}}</textarea>
                </div>

                <div class="style-section">
                    <label class="style-label">
                        <i class="ri-palette-line"></i>
                        Choisissez un style
                    </label>
                    <div class="list_style">
                        <label class="style-option">
                            <input type="radio" name="style" value="style1" checked>
                            <div class="style s1"></div>
                        </label>
                        <label class="style-option">
                            <input type="radio" name="style" value="style2">
                            <div class="style s2"></div>
                        </label>
                        <label class="style-option">
                            <input type="radio" name="style" value="style3">
                            <div class="style s3"></div>
                        </label>
                        <label class="style-option">
                            <input type="radio" name="style" value="style4">
                            <div class="style s4"></div>
                        </label>
                        <label class="style-option">
                            <input type="radio" name="style" value="style5">
                            <div class="style s5"></div>
                        </label>
                        <label class="style-option">
                            <input type="radio" name="style" value="style6">
                            <div class="style s6"></div>
                        </label>
                        <label class="style-option">
                            <input type="radio" name="style" value="style7">
                            <div class="style s7"></div>
                        </label>
                        <label class="style-option">
                            <input type="radio" name="style" value="style8">
                            <div class="style s8"></div>
                        </label>
                        <label class="style-option">
                            <input type="radio" name="style" value="style9">
                            <div class="style s9"></div>
                        </label>
                        <label class="style-option">
                            <input type="radio" name="style" value="style10">
                            <div class="style s10"></div>
                        </label>
                    </div>
                </div>

                <button type="submit" class="submit-btn">
                    <i class="ri-send-plane-fill"></i>
                    Publier
                </button>
            </form>
        </div>
    </main>

    <script>
        const msg = document.getElementById("message");
        const radios = document.querySelectorAll("input[type='radio']");

        const styleMap = {
            "style1": "linear-gradient(135deg, #3b82f6 0%, #2563eb 100%)",
            "style2": "linear-gradient(135deg, #06b6d4 0%, #0891b2 100%)",
            "style3": "linear-gradient(135deg, #10b981 0%, #059669 100%)",
            "style4": "linear-gradient(135deg, #f43f5e 0%, #e11d48 100%)",
            "style5": "linear-gradient(135deg, #f59e0b 0%, #d97706 100%)",
            "style6": "linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%)",
            "style7": "linear-gradient(135deg, #14b8a6 0%, #0d9488 100%)",
            "style8": "linear-gradient(135deg, #6366f1 0%, #4f46e5 100%)",
            "style9": "linear-gradient(135deg, #ec4899 0%, #db2777 100%)",
            "style10": "linear-gradient(135deg, #eab308 0%, #ca8a04 100%)"
        };

        radios.forEach(r => {
            r.addEventListener("change", () => {
                msg.style.background = styleMap[r.value];
                msg.style.transform = "scale(0.98)";
                setTimeout(() => {
                    msg.style.transform = "scale(1)";
                }, 200);
            });
        });
    </script>
</body>

</html>
